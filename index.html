<style>

.vl{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.in{display:block;width:100%;background:#ffffff14;border:1px solid #ffffff44;border-radius:12px;color:var(--moon);font:400 16px Mali,sans-serif;padding:10px 12px;margin-bottom:10px;user-select:text;-webkit-user-select:text}
#auth{position:fixed;inset:0;z-index:1500;display:none;place-items:center;padding:18px;background:#070b1fcc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

@media(prefers-reduced-motion:reduce){#hb{animation:none}.eq i{animation:none}.stk.hs svg{animation:none}}
</style>

const $=id=>document.getElementById(id),rm=matchMedia('(prefers-reduced-motion: reduce)').matches,S=new Date(2026,8,15);
let bz=16,zc=1,zt=1;
// ===== แก้ตรงนี้ได้ =====

 {type:'letter',label:'จดหมาย',emoji:'💌',gif:''},
 {type:'time',label:'เวลาของเรา',emoji:'⏳',gif:''},

 {type:'game',label:'มินิเกม',emoji:'🎮',gif:''},
 {type:'fortune',label:'คำทำนาย',emoji:'🔮',gif:''}
];

 {img:'',title:'ความทรงจำที่ 1',text:'ข้อความคู่กับรูปที่ 1'},
 {img:'',title:'ความทรงจำที่ 2',text:'ข้อความคู่กับรูปที่ 2'}

const SPOTIFY=[
 // {name:'เพลย์ลิสต์ของเรา',url:'https://open.spotify.com/playlist/xxxxxxxx'}
];

const SB={url:'https://azyjfsbankjqavnnlxhx.supabase.co',key:'sb_publishable_-sz0pUmnVrN72jaoRknayQ_i-iUR27N'};
if(SB.url){MEM.length=0;CFG.push({type:'add',label:'เพิ่มความทรงจำ',emoji:'➕',gif:''})}
// ===== จบส่วนที่แก้ได้ =====
const R=new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true}),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,300),cc=new THREE.Color();
R.setPixelRatio(Math.min(devicePixelRatio,2));
const tx=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.35,'#ffffffaa');r.addColorStop(1,'#fff0');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();

// intro stars

for(let i=0;i<SN;i++){const r=25+Math.random()*60,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);sp.set([r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a)],i*3);cc.setHSL(.6+Math.random()*.15,.5,.75+Math.random()*.2);sk.set([cc.r,cc.g,cc.b],i*3)}

for(let i=0;i<N;i++){const r=1.5+Math.pow(Math.random(),1.4)*14,an=r*.55+(i%3)*2.094,s=(Math.random()-.5)*(2.6-r*.1);gp.set([Math.cos(an)*r+s,(Math.random()-.5)*(1.4-r*.06),Math.sin(an)*r+s],i*3);cc.copy(c1).lerp(c2,r/15);gc.set([cc.r,cc.g,cc.b],i*3)}
const disc=pts(gp,gc,.13,.8);G.add(disc);
const AN=2600,ap=new Float32Array(AN*3),ak=new Float32Array(AN*3),c3=new THREE.Color('#fff3c4'),c4=new THREE.Color('#ff5a9c');
for(let i=0;i<AN;i++){const r=1.9+Math.random()*2.8,an=Math.random()*6.283;ap.set([Math.cos(an)*r,(Math.random()-.5)*.18,Math.sin(an)*r],i*3);cc.copy(c3).lerp(c4,(r-1.9)/2.8);ak.set([cc.r,cc.g,cc.b],i*3)}
const acc=pts(ap,ak,.14,.95);G.add(acc);
const HN=1500,hlp=new Float32Array(HN*3),hlk=new Float32Array(HN*3);
for(let i=0;i<HN;i++){const r=1.55+Math.random()*.3,an=Math.random()*6.283;hlp.set([Math.cos(an)*r,Math.sin(an)*r,(Math.random()-.5)*.1],i*3);cc.set(Math.random()<.5?'#fff3c4':'#ffb0c8');hlk.set([cc.r,cc.g,cc.b],i*3)}
const halo=pts(hlp,hlk,.12,.9);G.add(halo);
G.add(new THREE.Mesh(new THREE.SphereGeometry(1.5,32,24),new THREE.MeshBasicMaterial({color:0x000000})));
const M=2600,hp=new Float32Array(M*3),hk=new Float32Array(M*3);
for(let i=0;i<M;i++){const t=Math.random()*6.283,k=Math.random()<.5?1:Math.sqrt(Math.random()),x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);hp.set([x*k*.2,(y*k-2)*.2,(Math.random()-.5)*2.6*(1.1-k*.5)],i*3);cc.set(Math.random()<.7?'#ff7fa6':'#ffd98a');hk.set([cc.r,cc.g,cc.b],i*3)}
const hrt=pts(hp,hk,.15,1);hrt.scale.setScalar(.38);hrt.position.y=3.8;G.add(hrt);

fit();addEventListener('resize',fit);
// stickers + floating words

function mk(label,emoji,gif,fn){const el=document.createElement('button'),sm='<small>'+label+'</small>';el.className='stk';el.setAttribute('aria-label',label);
 if(gif){el.classList.add('g');el.innerHTML='<img alt="" draggable="false" src="'+gif+'">'+sm;el.firstChild.onerror=()=>{el.classList.remove('g');el.innerHTML=emoji+sm}}else el.innerHTML=emoji+sm;
 el.onclick=fn;return el}
function mkHeart(label,fn){const el=document.createElement('button'),sm=document.createElement('small');el.className='stk hs';el.setAttribute('aria-label',label);
 el.innerHTML='<svg viewBox="0 0 100 92" style="animation-delay:-'+(Math.random()*1.2).toFixed(2)+'s"><path d="M50 88C20 62 2 44 2 26 2 12 12 3 25 3c11 0 20 6 25 15C55 9 64 3 75 3c13 0 23 9 23 23 0 18-18 36-48 62z" fill="#ff2d55"/><path d="M22 14C14 16 9 23 10 31" stroke="#ffffff88" stroke-width="4" fill="none" stroke-linecap="round"/></svg>';
 sm.textContent=label;el.appendChild(sm);el.onclick=fn;return el}

['รักนะ','คิดถึง','โบ๊ท ❤ โอปอ','2 เดือน','✦','เธอคือดาวของฉัน','♡','ตลอดไป'].forEach((t,i)=>{const el=document.createElement('span');el.className='chip';el.textContent=t;const a=Math.random()*6.283,r=2.8+Math.random()*4.5;add(el,new THREE.Vector3(Math.cos(a)*r,(Math.random()-.5)*5,Math.sin(a)*r),.4+i*.12,1)});
const v=new THREE.Vector3();
function place(it,e){v.copy(it.p).multiplyScalar(e);G.localToWorld(v);const d=v.distanceTo(cam.position);v.project(cam);const x=(v.x+1)/2*innerWidth,y=(1-v.y)/2*innerHeight,s=Math.max(.25,Math.min(1.4,17/d))*(.4+.6*e);

// ===== สวนจักรวาล: กุหลาบ 3D + ผีเสื้อ =====
const RN=2800,NL=6,rp=new Float32Array(RN*3),rk=new Float32Array(RN*3),RD=[],rc1=new THREE.Color('#ffe6a8'),rc2=new THREE.Color('#ff4f8f');

 if(TB.length>1)TB.forEach((p,i)=>{const t=document.createElement('button');t.type='button';t.textContent=p.name;if(i===vi)t.className='on';t.onclick=()=>{vi=i;V.music(b)};$('pt').appendChild(t)})},

  try{let path=null;if(f){const gif=f.type==='image/gif';if(gif&&f.size>5242880)throw new Error('GIF ใหญ่เกิน 5 MB');const blob=gif?f:await shrink(f),u=(await sb.auth.getUser()).data.user;path=u.id+'/'+Date.now()+(gif?'.gif':'.jpg');const up=await sb.storage.from('photos').upload(path,blob,{contentType:gif?'image/gif':'image/jpeg'});if(up.error)throw up.error}
   const ins=await sb.from('memories').insert({title:$('ft').value.trim()||null,body:tt,image_path:path}).select('id,title,body,image_path').single();if(ins.error)throw ins.error;
   await pushMem(ins.data,true);$('fm').textContent='บันทึกแล้ว มีหัวใจดวงใหม่ลอยขึ้นมา ❤';$('ft').value=$('fy').value=$('ff').value='';$('fn').textContent=''}
  catch(e){$('fm').textContent='บันทึกไม่สำเร็จ: '+(e.message||e)}

};

let sb=null;
function shrink(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('บีบรูปไม่ได้')),'image/jpeg',.82)};im.onerror=()=>no(new Error('เปิดรูปไม่ได้'));im.src=u})}
async function pushMem(r,live){let img='';if(r.image_path){const g=await sb.storage.from('photos').createSignedUrl(r.image_path,21600);img=g.data?g.data.signedUrl:''}
 const m={img,title:r.title||'ความทรงจำ',text:r.body||''};MEM.push(m);
 const d=live?(performance.now()-t0-1500)/1000:(CFG.length+MEM.length)*.2;
 add(mkHeart(m.title.slice(0,14),()=>open('mem',m)),spot(CFG.length+MEM.length-1),d,0)}

const fm=x=>isFinite(x)?Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0'):'0:00';
function spUI(){const p=$('pp');if(!p)return;const cu=PL.concat(SPOTIFY.map(x=>({sp:x.url})))[vi],t=Q[qi]||(cu&&cu.tracks&&cu.tracks[0]);p.textContent=AU.paused?'▶':'⏸';
 if(t){$('tt').textContent=t.title;$('ar').textContent=t.artist;$('cv').style.backgroundImage=t.cover?'url('+t.cover+')':'';$('cv').classList.toggle('im',!!t.cover)}
 $('sh').classList.toggle('on',SH);$('rp').textContent=RP===2?'🔂':'🔁';$('rp').classList.toggle('on',RP>0);
 document.querySelectorAll('#ls2 .tr').forEach((e,i)=>e.classList.toggle('on',!!cu&&!!cu.tracks&&Q[qi]===cu.tracks[i]))}
function spTime(){if(!$('sk'))return;const d=AU.duration;$('t1').textContent=fm(AU.currentTime);$('t2').textContent=fm(d);if(isFinite(d)&&d>0)$('sk').value=AU.currentTime/d*1000}
function playQ(){if(!Q[qi])return;AU.src=Q[qi].url;AU.play().catch(()=>{});spUI()}
function nextTr(auto){if(!Q.length)return;if(RP===2&&auto){AU.currentTime=0;AU.play().catch(()=>{});return}
 if(SH&&Q.length>1){let k;do{k=Math.random()*Q.length|0}while(k===qi);qi=k}else{qi++;if(qi>=Q.length){if(RP===0&&auto){qi=Q.length-1;AU.pause();spUI();return}qi=0}}playQ()}
function prevTr(){if(!Q.length)return;if(AU.currentTime>3){AU.currentTime=0;return}qi=(qi-1+Q.length)%Q.length;playQ()}
AU.onplay=AU.onpause=spUI;AU.ontimeupdate=AU.onloadedmetadata=spTime;AU.onended=()=>nextTr(true);
async function loadSong(){const sg=async n=>{const g=await sb.storage.from('photos').createSignedUrl(n,21600);return g.data?g.data.signedUrl:''},
 ld=async(dir,name)=>{const l=await sb.storage.from('photos').list(dir);if(l.error||!l.data)return null;
  const au=l.data.filter(x=>/\.(mp3|m4a|aac|ogg|wav)$/i.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name)),im=l.data.filter(x=>/\.(jpe?g|png|webp)$/i.test(x.name));
  const tracks=(await Promise.all(au.map(async f=>{const b=f.name.replace(/\.[^.]+$/,''),c=im.find(x=>x.name.replace(/\.[^.]+$/,'')===b)||im.find(x=>/^cover\./i.test(x.name)),p=b.split(' - ');
   return{title:(p[1]||p[0]).trim(),artist:p[1]?p[0].trim():'โบ๊ท & โอปอ',url:await sg(dir+'/'+f.name),cover:c?await sg(dir+'/'+c.name):''}}))).filter(t=>t.url);
  return tracks.length?{name,tracks}:null},
 root=await sb.storage.from('photos').list('music');if(root.error||!root.data)return;
